# Render blueprint. Synthetic data, fictional company.
#
# Two free web services from the same Dockerfile: the app and the API. The hosted demo
# runs the labelled stand-in (no LLM key is set anywhere) and is read-only.
#
# The three console passwords and the API token are generated by Render when the
# blueprint is first applied (`generateValue: true`), so no secret is ever typed, stored
# in this file, or sent through a chat. To see or change one: the service's Environment
# page in the Render dashboard.
services:
  - type: web
    name: digital-success-os-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: CONSOLE_PASSWORD_CSM
        generateValue: true
      - key: CONSOLE_PASSWORD_SALES
        generateValue: true
      - key: CONSOLE_PASSWORD_ADMIN
        generateValue: true

  - type: web
    name: digital-success-os-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
