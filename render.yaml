# Render blueprint. Synthetic data, fictional company.
#
# Two free web services from the same Dockerfile: the app and the API. The hosted demo
# runs offline (no LLM key is set anywhere) and is read-only.
# Set the three console passwords and the API token in the Render dashboard; they are
# marked `sync: false` so they are never stored in this file.
services:
  - type: web
    name: digital-success-os-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: CONSOLE_PASSWORD_CSM
        sync: false
      - key: CONSOLE_PASSWORD_SALES
        sync: false
      - key: CONSOLE_PASSWORD_ADMIN
        sync: false

  - type: web
    name: digital-success-os-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "uv run --no-dev uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        sync: false