# Render blueprint. Synthetic data, fictional company.
#
# Two free web services from the same Dockerfile (the app and the API) and one free
# Postgres database that both use as the operational store, so a task resolved through
# the API shows up in the app. The hosted demo runs the labelled stand-in (no LLM key is
# set anywhere).
#
# No secret is typed, stored in this file, or sent through a chat:
#   - the three console passwords and the API token are generated by Render
#     (`generateValue: true`);
#   - the database address is passed from the database to the services by Render
#     (`fromDatabase`).
# To see or change a value: the service's Environment page in the Render dashboard.
databases:
  - name: digital-success-os-db
    plan: free

services:
  - type: web
    name: digital-success-os-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: CONSOLE_PASSWORD_CSM
        generateValue: true
      - key: CONSOLE_PASSWORD_SALES
        generateValue: true
      - key: CONSOLE_PASSWORD_ADMIN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: digital-success-os-db
          property: connectionString
      - key: DSO_OPERATIONAL_STORE
        value: env:DATABASE_URL

  - type: web
    name: digital-success-os-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: digital-success-os-db
          property: connectionString
      - key: DSO_OPERATIONAL_STORE
        value: env:DATABASE_URL
