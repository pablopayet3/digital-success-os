# Runs on every pull request and on every push to main.
# Synthetic data, fictional company. No secrets are needed: CI runs in dev, offline.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DSO_ENV: dev
  DSO_OFFLINE_MODE: "true"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint, tests, dbt build on DuckDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (generate a small world, run the pipeline, train, check everything)
        run: uv run pytest -q
      - name: dbt build against DuckDB
        run: |
          uv run python run.py data --profile small
          uv run python run.py pipeline

  store-on-postgres:
    name: Operational store on a real Postgres
    runs-on: ubuntu-latest
    # A throwaway database that exists only for this job. Its password is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DSO_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dso
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dso
      DSO_LLM_STAND_IN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: The same store tests on SQLite and on Postgres
        run: uv run pytest -q tests/test_store.py
      - name: Two simulated days on the local store (what the container image carries)
        run: |
          uv run python run.py data --profile small
          uv run python run.py pipeline
          uv run python run.py train
          uv run python run.py run-days 2
      - name: Seed the hosted store from it, twice (the second time must change nothing)
        env:
          DSO_OPERATIONAL_STORE: env:DATABASE_URL
        run: |
          uv run python scripts/seed_store.py
          uv run python scripts/seed_store.py
          uv run python scripts/check_store.py postgresql
      - name: The engine carries on for a day with its store on Postgres
        env:
          DSO_OPERATIONAL_STORE: env:DATABASE_URL
        run: |
          uv run python run.py run-days 1
          uv run python run.py experiments
          uv run python scripts/check_store.py postgresql
