# On every merge to main: build the image, publish it, and ask the host to deploy it.
# Synthetic data, fictional company. The image runs offline and contains no secrets.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Ask the host to deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the deploy hooks (skipped until the secrets exist)
        env:
          APP_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_APP }}
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$APP_HOOK" ]; then
            echo "No deploy hook configured yet. The image was built and published."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$APP_HOOK"
          if [ -n "$API_HOOK" ]; then curl --fail --silent --show-error -X POST "$API_HOOK"; fi