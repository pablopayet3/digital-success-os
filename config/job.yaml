# Synthetic data, fictional company (Lumen Labs / Relay).
#
# The ten lines of the role this demo was built for, in plain words, and where each one is
# shown in the app. This file is the single source for three places:
#   - the opening of every page (app/ui.py::job_intro),
#   - the table "A guide to the pages" on the Overview page,
#   - the guided tour (app/tour.py).
#
# lines:
#   line   a short name for the capability (shown on screen)
#   asks   the sense of the posting's line (kept for reference; never shown on screen)
#   plain  the capability in plain words, with every term defined (shown on screen)
#   pages  the pages that show it (files in app/views/)
# pages:
#   what a visitor sees on each page, in one or two sentences
#
# How it is written: complete sentences, every term defined where it is used, each team
# named as a team. The reader is a hiring panel reading it for the first time. On screen
# it must read as a guide to the app's pages, never as notes about a job posting: the
# owner's rule of 13 November 2026.

lines:
  - line: Pilot, then scale
    asks: >
      Create the systems, data flows and journey orchestration that support customers who
      have no assigned success manager. Run it as a pilot first, then extend the pattern to
      more customer segments.
    plain: >
      The system looks after the customers who have no assigned success manager. It uses
      data and automation instead of hiring more staff. It is proven on one group of
      customers first, and then extended to the others.
    pages: [pilot]

  - line: Turn data into action
    asks: >
      Convert product usage, lifecycle stage, health, contact engagement, sentiment,
      support and commercial signals into plays, triggers for the AI agent, tasks and
      handoffs to people.
    plain: >
      A signal is a warning sign or an opportunity found in a customer's data, such as a
      setup that has stalled. A play is the prepared response to one signal. The system
      matches each signal with the right response.
    pages: [accounts]

  - line: Close ownership gaps
    asks: >
      Act as the accountable owner across teams, and establish where the ownership of a
      system or a process is unclear.
    plain: >
      When several teams share a system, some parts of it often belong to no team at all.
      The ownership map finds those parts, so that each one can be given an owner.
    pages: [operating]

  - line: Protect delivery momentum
    asks: >
      Maintain the decision log, the architecture principles, the dependency map and the
      change-control process, so that agreed decisions are not reopened without a clear
      reason.
    plain: >
      Each decision is recorded with its reasons, so that the same question is not argued
      again every month.
    pages: [operating]

  - line: Data foundation and pipelines
    asks: >
      Define the requirements for clean, reliable account, contact, product, engagement,
      lifecycle and health data, and work with the Data Engineering and Revenue Operations
      teams on the pipelines and tables.
    plain: >
      This page shows which data the plays need and what counts as clean data. The
      requirements are written down, the Data Engineering team builds the tables to meet
      them, and automated checks enforce them.
    pages: [quality]

  - line: Analytics and modelling
    asks: >
      Work with the Analytics team on exploratory analysis, segmentation, predictive models
      and the design of measures for adoption, churn, time to value, readiness to expand,
      engagement quality and agent effectiveness.
    plain: >
      The models estimate which customers are at risk of leaving and which are ready to
      buy more. Each estimate comes with the evidence behind it.
    pages: [accounts, ask]

  - line: AI-agent signal design
    asks: >
      Work with the AI Agent Engineering team and the Data Science team to turn metrics and
      models into practical agent plays, prompts, retrieval logic, escalation rules and
      feedback loops.
    plain: >
      These pages show when the AI agent steps in, what it may answer, and when it must
      pass the customer to a person. The agent in this demonstration helps customers finish
      setting up the product. It is not a general support agent.
    pages: [demo, agent]

  - line: Journey orchestration
    asks: >
      Put into operation the journeys, the tasks for people, the shared-mailbox workflows,
      the audience rules, consent and contact governance, the channel triggers and the
      journey analytics.
    plain: >
      A journey is the sequence of steps that a play follows: an email, then the AI agent,
      then a person. Rules decide who enters a journey, who is left out, and how often a
      customer may be contacted.
    pages: [plays]

  - line: Digital-to-human handoffs
    asks: >
      Define what context moves from digital journeys and AI agents to human teams, and
      what return signal is needed to continue the journey.
    plain: >
      When the automated steps pass a customer to a person, that person receives
      everything the system already knows. The outcome that the person records goes back
      into the system.
    pages: [console]

  - line: Measurement and experimentation
    asks: >
      Work with the Analytics team on cohort analysis, A/B tests and operating reviews that
      show the effect on adoption, monthly active users and consumption, engagement, agent
      invocation, escalation conversion and the closure of setup steps.
    plain: >
      Each play is measured against a holdout: a group of similar customers who qualified
      for the play but were deliberately left alone. The difference between the two groups
      shows what the play achieved.
    pages: [plays]

pages:
  quality: >
    This page shows the data that arrives each day, the records that were rejected and
    why, and the automated checks that every table must pass before a play may use it.
  accounts: >
    This page shows one customer at a time. At the top are its health score, its risk of
    leaving and its likelihood of buying more. Below are the signals found in its data
    today, and a record of every action the system took or decided not to take.
  plays: >
    This page starts with the catalog of plays. For each play it shows the signal that
    starts it, its steps, its owner and how its success is measured. Below are the result
    of each play against its holdout, and one play in detail.
  demo: >
    This page holds a live conversation with the AI agent, in which you play the
    administrator of one customer. Ask a question about setup, then ask for a price, and
    watch a rule pass the customer to the Sales team.
  agent: >
    This page shows every conversation the agent has had, the customer replies it sorted
    in the shared mailbox, and its results on a fixed set of test conversations.
  console: >
    This page shows the queue of tasks waiting for a person, as that person sees it. Each
    task explains why it was created, quotes the customer's own words, lists what was
    already tried, and recommends a next step. A sign-in is required because each role
    sees only its own queue.
  pilot: >
    This page shows which customers are in the pilot, whether the pilot is ready to run,
    how each play is progressing, and what would happen if the next group of customers
    were added.
  operating: >
    This page holds the working documents of the program: who owns what, which decisions
    were taken and why, what each team depends on, and how a decision can be changed.
  ask: >
    This page answers questions about the data and the program, typed or spoken. Claude,
    an AI model, reads the warehouse and the documents to answer, and shows how it found
    each answer. Example questions are grouped by team.

# The workflow on the Overview page: each step and the team accountable for it.
workflow:
  - step: Data arrives and is validated
    team: Data Engineering
  - step: Signals and health scores are computed
    team: Data Science
  - step: Plays decide who receives which help
    team: CS Operations
  - ladder: Help is offered in this order, from the least costly to the most
    rungs:
      - step: 1. An automated email or in-app message
        team: CS Operations
      - step: 2. The AI agent
        team: AI Agent Engineering
      - step: 3. A person
        team: Scaled CS and Sales
  - step: The customer receives the help
    note: The customer is outside the company and never sees this system.
  - step: Results are measured, and a decision is made
    team: Analytics and CS Leadership

# Every signal the system looks for, in plain words (the exact rules are in docs/metrics.md).
# Shown on the Overview page, under the three terms.
signals:
  - id: activation_stalled
    name: Setup has stalled
    kind: Warning
    fires_when: The customer signed up at least 7 days ago and has completed fewer than half of the setup steps.
  - id: usage_drop
    name: Usage is falling
    kind: Warning
    fires_when: The customer's monthly active users fell by 30% or more compared with the previous 30 days.
  - id: support_friction
    name: Repeated support problems
    kind: Warning
    fires_when: The customer opened three or more high-priority support tickets in 30 days.
  - id: detractor
    name: Unhappy in a survey
    kind: Warning
    fires_when: The customer gave a satisfaction score of 6 or lower, out of 10, in the last 14 days.
  - id: churn_risk_high
    name: High risk of leaving
    kind: Warning
    fires_when: The prediction model ranks the customer among those most likely to cancel, up to the number the team can handle that day.
  - id: no_valid_admin
    name: No contact we may email
    kind: Warning
    fires_when: The customer has no administrator who has agreed to receive email and has a working address.
  - id: seat_pressure
    name: Seats are nearly full
    kind: Opportunity
    fires_when: The customer uses 90% or more of the seats it pays for.
  - id: edition_fit
    name: Outgrowing the edition
    kind: Opportunity
    fires_when: The customer has reached a limit of its edition, such as automation rules, integrations or AI credits, and is not on the top edition.
  - id: cross_product
    name: Ready for a second product
    kind: Opportunity
    fires_when: The customer does not own the documents product and has created three or more document-style boards in 60 days.
  - id: expansion_ready
    name: Likely to buy more
    kind: Opportunity
    fires_when: The prediction model ranks the customer among those most likely to buy more, up to the number the team can handle that day.
