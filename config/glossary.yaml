# Synthetic data, fictional company (Lumen Labs / Relay).
#
# What each number in the app means. A visitor reads it by hovering over the question mark
# next to the number (app/ui.py::metric). One entry per label, exactly as the label is
# written on screen. A test fails when a number is shown without a definition.
#
# How it is written: complete sentences in plain American English, every term defined, no
# jargon. Say what is counted, out of what, and why the number matters.

# --- Overview: the pilot at a glance
Accounts in the pilot: >
  The number of customers in the pilot. The pilot is a first trial of this system on the
  customers who have no assigned success manager.
ARR in the pilot: >
  ARR stands for annual recurring revenue. It is the total that the customers in the pilot
  pay each year for their subscriptions.
"Health: red": >
  The number of customers in the pilot whose health score is in the red band, which means
  they need attention. The health score runs from 0 to 100, and the Accounts page explains
  how it is calculated.
In a play now: >
  The number of customers who are in a play today. A customer enters a play when its data
  shows a signal and it passes the rules for entry, for example by having agreed to be
  contacted. The system then sends it the response prepared for that signal: an email
  first, then the AI agent, and a person only when one is needed. The customer leaves the
  play when the goal is reached or when the steps run out.
Tasks open for people: >
  The number of handoffs waiting for a person. Each one is a task for a success manager or
  for the Sales team. A task is created when the automated steps cannot, or must not,
  handle a matter themselves.

# --- Overview: the measures the pilot is run on
Monthly active users: >
  The number of people who used the product at least once in the last 30 days, across all
  the customers in the pilot. It shows whether customers are adopting the product.
AI credits used, 30 days: >
  How much customers used the product's AI feature in the last 30 days, counted in credits.
  It shows how deeply customers use the product, not just whether they log in.
Prerequisite closure: >
  The average share of setup steps that customers have completed, such as inviting users or
  connecting another application. Finishing setup is the first sign that a customer will
  get value from the product.
Agent invocation: >
  The share of customers in a play who had a conversation with the AI agent. It shows how
  often the agent is used. It does not show how well the agent answers.
Handoff rate: >
  The share of the AI agent's conversations that it passed to a person. A rate that is too
  high means the agent helps too little. A rate that is too low may mean the agent answers
  questions that it should pass on.
Escalation conversion: >
  An escalation is the moment when the automated steps pass a customer to a person, which
  creates a task. This number is the share of closed tasks that ended well: the problem was
  solved, the customer stayed, or a sales opportunity was found. It shows whether the
  escalations were worth a person's time.
Revenue retained: >
  The share of yearly revenue that customers in a play were still paying 30 days after they
  entered it. The line beneath gives the same share for similar customers who were
  deliberately left alone. Only the difference between the two groups can be credited to
  the plays.
Expansion from the plays: >
  The new revenue won from customers within 30 days of entering a play, for example when
  they bought more seats. The line beneath compares it with similar customers who were
  deliberately left alone. The difference is what the plays may have added.

# --- Overview: from signal to outcome
Customers with a signal: >
  The number of customers who show at least one signal today. A signal is a warning sign
  or an opportunity found in a customer's data, such as a setup that has stalled.
Entered a play: >
  The number of customers who qualified for a play and were placed in it. They receive the
  response prepared for their signal.
Held out: >
  The number of customers who qualified for a play but were deliberately left alone, so
  that the effect of the play can be measured by comparison. This group is called the
  holdout.
Touches delivered: >
  The number of messages actually delivered to customers. A message can be an email, a
  message inside the product, or a conversation with the AI agent.
Agent conversations: >
  The number of conversations between the onboarding AI agent and a customer.
Handed to a person: >
  The number of tasks created for a person. A task can come from a play's journey, from the
  AI agent, or from a customer's reply in the shared mailbox.
Closed by a person: >
  The number of tasks that a person has finished and closed with a recorded outcome.

# --- Data quality
Data tests passing: >
  Automated checks that every table must pass before any play may use it. For example, no
  customer appears twice, every record names its customer, and every value lies in its
  expected range.
Contract checks passing: >
  The data contract is a written list of what the main table promises to contain: its
  columns, their types and the values they may hold. Code checks each promise every time
  the data is loaded.
Sources checked for freshness: >
  Freshness means that the data arrived on time. A source that stops delivering is flagged
  before out-of-date data can start a play.

# --- Accounts, and the handoff packet
Health: >
  A score from 0 to 100 that summarizes how well the customer is doing. It combines five
  parts: product use, response to messages, survey answers, support tickets and seats.
  Green means healthy, yellow means worth watching, and red means the customer needs
  attention.
Churn risk: >
  Churn means a customer cancelling its contract. This is a model's estimate of the chance
  that this customer will churn within the next 90 days. The model looks at the customer's
  product use, setup, support tickets and response to messages.
Expansion likelihood: >
  A model's estimate of the chance that this customer will buy more within the next 90
  days, such as extra seats or a higher edition of the product.
Seats: >
  The number of seats in use, out of the seats the customer pays for. Nearly full means the
  customer may need more seats. Mostly empty means the product is not being adopted.
Renewal in: >
  The number of days until this customer's contract comes up for renewal.

# --- Agents
Mailbox replies triaged: >
  The number of customer replies to our emails that were sorted. The replies arrive in a
  shared mailbox. An AI model labels each reply, and rules decide where it goes. Triage
  means sorting by what the reply asks for and how urgent it is.
LLM cost so far: >
  What the AI model has charged to write these conversations. LLM stands for large language
  model, the kind of AI behind the agent.

# --- Pilot: handoff quality
Time to pickup: >
  The average time between the moment a task is created and the moment a person starts
  working on it.
SLA breach rate: >
  The share of tasks that were not picked up within the time promised for their queue. SLA
  stands for service-level agreement, which is that promised response time.
Unnecessary handoffs: >
  The share of closed tasks that the person marked as something the AI agent should have
  handled. Each one becomes a new test case for the agent.
Re-contact: >
  The share of closed tasks that were followed by a new task for the same customer within
  14 days. A high share means the first handoff did not settle the matter.
Docs gap share: >
  The share of the AI agent's handoffs that happened because no help article covered the
  question. Each one points to an article that should be written.
