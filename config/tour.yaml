# Synthetic data, fictional company (Lumen Labs / Relay).
#
# The guided tour: a slim strip at the top of the page (app/tour.py). One stop per page, in
# the order of the menu. The strip never covers the page it explains.
#
#   page     the page the stop opens (a file in app/views/)
#   company  which platform does this at a real company, and which team works in it
#
# What a page is for is said by the page itself, in its opening (config/job.yaml), so the
# tour has nothing to repeat. It adds the one fact the pages may not show: the real tools.
#
# Real product names appear here on purpose, as plain text: the tour exists to show how
# the one app maps onto the several platforms a real company uses. Nothing else in the app
# names them (see the conventions in CLAUDE.md).

stops:
  - page: overview
    company: >
      Each step runs in a different platform, owned by a different team: Databricks for
      data, Gainsight for journeys and tasks, Salesforce for customer records, Tableau for
      reporting, and the company's own AI agents. Select Next to walk through the work in
      order.
  - page: quality
    company: >
      At a real company this is the Databricks lakehouse, built and monitored by the Data
      Engineering team. This same pipeline was also run on a real Databricks workspace.
  - page: accounts
    company: >
      At a real company these are health scores in Gainsight, supplied by Databricks. The
      Data Science team owns the predictive models, and a success manager reads this view
      before speaking to a customer.
  - page: plays
    company: >
      At a real company the journeys run in Gainsight Journey Orchestrator, operated by the
      CS Operations team. The results are read in Tableau by CS Leadership and the
      Analytics team. This demo has a real, public Tableau dashboard.
  - page: demo
    company: >
      At a real company these are the company's own AI agents, built by the AI Agent
      Engineering team. Here the agent is Claude. Only the customer ever sees this
      conversation, so on this page you take the customer's place.
  - page: agent
    company: >
      At a real company this is the evaluation suite of the AI Agent Engineering team, run
      before every change to the agent.
  - page: console
    company: >
      At a real company these are tasks in Gainsight Cockpit and in Salesforce, worked by
      the Scaled CS team and the Sales team. Tasks from this demo were pushed into a real
      Salesforce org.
  - page: pilot
    company: >
      At a real company this is the pilot plan and the weekly review, kept in Confluence
      and Jira and presented to CS Leadership.
  - page: operating
    company: >
      At a real company these documents live in Confluence and Jira, and every team in the
      chain relies on them.
  - page: overview
    company: >
      What was run for real: the data pipeline on a Databricks workspace, tasks pushed into
      a Salesforce org, a public Tableau dashboard, the Claude API answering on the Live
      demo page, a Postgres database behind this site, and GitHub Actions running the tests
      on every change and the pipeline every day. Gainsight has no free version, so this
      application stands in for it. The customers are simulated.
