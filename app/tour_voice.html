<!-- Synthetic data, fictional company. The guided tour's "Read aloud" button (app/tour.py).
     The browser's own voice reads the window: no service, no key, no network.
     __SENTENCES__ is replaced by the window's sentences before the page is drawn. -->
<button type="button" id="tour-voice"
        style="font: inherit; color: inherit; background: transparent; cursor: pointer;
               border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 0.5rem;
               padding: 0.25rem 0.75rem;">Read aloud: off</button>
<script>
(() => {
  const sentences = __SENTENCES__;
  const button = document.getElementById("tour-voice");
  const synth = window.speechSynthesis;
  if (!button) return;
  if (!synth) { button.style.display = "none"; return; }  // this browser has no voice

  // On or off is remembered for the visit, so the voice carries on from window to window.
  const isOn = () => sessionStorage.getItem("tourVoice") === "on";
  const show = () => {
    button.textContent = isOn() ? "Read aloud: on" : "Read aloud: off";
    button.setAttribute("aria-pressed", isOn());
  };

  // The best English voice this browser has: a natural-sounding one when there is one.
  const voice = () => {
    const english = synth.getVoices().filter((v) => v.lang.startsWith("en"));
    return english.find((v) => v.name.includes("Natural"))
      || english.find((v) => v.name.includes("Google"))
      || english[0];
  };

  // One sentence at a time: some browsers cut a long reading off after fifteen seconds.
  const read = () => {
    synth.cancel();
    const chosen = voice();
    for (const sentence of sentences) {
      const line = new SpeechSynthesisUtterance(sentence);
      line.lang = "en-US";
      if (chosen) line.voice = chosen;
      synth.speak(line);
    }
  };

  button.onclick = () => {
    sessionStorage.setItem("tourVoice", isOn() ? "off" : "on");
    show();
    if (isOn()) read(); else synth.cancel();
  };

  synth.cancel();      // a new window: stop reading the previous one
  show();
  if (isOn()) read();  // the visitor turned the voice on earlier: keep reading

  // Stop when the window is closed. (When the next window replaced it, leave that one alone.)
  const watch = setInterval(() => {
    if (document.body.contains(button)) return;
    clearInterval(watch);
    if (!document.getElementById("tour-voice")) synth.cancel();
  }, 500);
})();
</script>
