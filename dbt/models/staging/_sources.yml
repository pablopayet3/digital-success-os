version: 2

# Bronze: raw data exactly as it arrived, loaded by ingest/load.py.
# Synthetic data, fictional company.
sources:
  - name: bronze
    schema: bronze
    description: Raw landing data. Events are append-only; the other tables are full snapshots.
    tables:
      - name: events
        description: Product telemetry that passed schema validation. May contain duplicates and wrong clocks.
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 96, period: hour}
      - name: dead_letter
        description: Rows rejected at ingest, with the reason.
      - name: _load_log
        description: Which event files have been loaded, so re-runs do nothing.
      - name: crm_accounts
      - name: crm_contacts
      - name: crm_opportunities
      - name: licenses
      - name: tickets
      - name: nps
      - name: email_engagement
      - name: mailbox
      # The operational store (what the engine, the agents and the staff did), copied
      # as it is on every pipeline run by ingest/load_ops.py.
      - name: ops_enrollments
        description: Who is in which play, and in which arm (treatment or holdout).
      - name: ops_touches
        description: Every email, in-app prompt and agent conversation delivered.
      - name: ops_ctas
        description: Tasks handed to people, with their outcome.
      - name: ops_conversations
        description: Conversations the onboarding agent had.
      - name: ops_mailbox_triage
        description: What the mailbox triage agent did with each reply.

  # Tables written by Python (analytics/score.py) between the two dbt stages.
  - name: analytics
    schema: gold
    description: Model scores and behaviour clusters, written back to the warehouse.
    tables:
      - name: account_scores
        description: Churn-risk and expansion scores per account per day, with top reasons.
      - name: account_clusters
        description: Behaviour cluster (k-means) per account, as of today.
