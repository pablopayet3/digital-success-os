version: 2

# Gold: tables ready to use. Synthetic data, fictional company.
models:
  - name: dim_account
    description: One row per account as it stands today.
    columns:
      - name: account_id
        data_tests: [unique, not_null]

  - name: dim_contact
    description: One row per contact, with the flags plays check before a touch.
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
      - name: can_email
        description: True when the contact has opted in and the email address works.
        data_tests: [not_null]
      - name: is_valid_admin
        description: True for an admin with a working email address.
        data_tests: [not_null]

  - name: fct_usage_daily
    description: Product usage per account per day, including rolling 30-day MAU and Assist credits.
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: mau_30d
        description: Different users active in the 30 days ending on the snapshot date.
        data_tests: [not_null]

  - name: fct_prerequisites
    description: Setup prerequisites per account and the share that is done.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: prerequisite_closure_pct
        description: Share of the four setup steps completed (0, 0.25, 0.5, 0.75 or 1).
        data_tests: [not_null]

  - name: int_account_daily_base
    description: Building block for account_daily. Every fact about an account on a day.

  - name: int_account_daily_health
    description: >
      The daily facts plus the explainable health score and its five components.
      This is the table the models read their features from.
    columns:
      - name: health_score
        description: Weighted average of the five components, 0 to 100. Weights in config/health.yaml.
        data_tests: [not_null]
      - name: health_band
        data_tests:
          - accepted_values:
              arguments:
                values: [green, yellow, red]

  - name: fct_outcome_labels
    description: >
      Whether each account churned or expanded in the 90 days after each day, taken from
      the CRM. The labels the models learn from.
    columns:
      - name: churned_within_90d
        data_tests: [not_null]
      - name: expanded_within_90d
        data_tests: [not_null]

  - name: signals
    description: One row per account, per day, per signal that is firing. Read by the rules engine.
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: signal_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - activation_stalled
                  - usage_drop
                  - seat_pressure
                  - edition_fit
                  - cross_product
                  - detractor
                  - support_friction
                  - no_valid_admin
                  - churn_risk_high
                  - expansion_ready
                  - advocate_ready
      - name: evidence
        description: The reason in words, for a human or an agent.
        data_tests: [not_null]

  - name: account_current
    description: Every active account as it stands today, with segmentation and the signals firing.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: value_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [free, low, mid, high]

  - name: account_daily
    description: >
      The production table. One row per account per day, joining usage, seats, setup,
      support, sentiment, contact engagement and commercial data, with the health score,
      the model scores and the lifecycle stage.
      Contract in contracts/account_daily.yaml.
    columns:
      - name: lifecycle_stage
        description: Where the account is in its life. Rules and precedence in docs/metrics.md.
        data_tests:
          - accepted_values:
              arguments:
                values: [onboarding, adopting, mature, expansion, renewal, at_risk]
      - name: health_score
        description: Explainable health score, 0 to 100.
        data_tests: [not_null]
      - name: account_id
        description: The account. Joins to every other table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: snapshot_date
        description: The day this row describes.
        data_tests: [not_null]
      - name: seat_utilisation
        description: Seats assigned divided by seats licensed.
        data_tests: [not_null]
      - name: prerequisite_closure_pct
        description: Share of the four setup steps done on that day.
        data_tests: [not_null]
      - name: coverage_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [high_touch, pooled, uncovered]

  - name: dq_summary
    description: What the pipeline caught, one row per data-quality measure.
    columns:
      - name: measure
        data_tests: [unique, not_null]

  - name: metrics_play_outcomes
    description: >
      What happened to every account that entered a play, treatment and holdout alike.
      One row per enrolment, with six yes/no outcomes over the measurement window.
    columns:
      - name: enrollment_id
        data_tests: [unique, not_null]
      - name: arm
        description: treatment (received the play) or holdout (held back for comparison).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [treatment, holdout]
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: highest_tier
        description: The highest rung of the intervention ladder the account reached.
        data_tests:
          - accepted_values:
              arguments:
                values: [none, digital, agentic, human]
      - name: retained_30d
        data_tests: [not_null]

  - name: metrics_play_summary
    description: Each play's results by arm and metric. The play config names the success metric.
    columns:
      - name: accounts
        data_tests: [not_null]

  - name: metrics_play_ladder
    description: Results per rung of the intervention ladder (digital, agentic, human).

  - name: metrics_handoffs
    description: Handoffs to people by queue, reason and source, with pickup time, SLA breaches and outcomes.

  - name: metrics_agent
    description: How the onboarding agent's conversations ended, by origin, prompt version and reason.

seeds:
  - name: edition_limits
    description: What each edition includes. Reaching a limit is a signal that the next edition fits.
    columns:
      - name: edition
        data_tests: [unique, not_null]
