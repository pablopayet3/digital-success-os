[project]
name = "digital-success-os"
version = "0.1.0"
description = "Mini Digital Success OS: customer signals to plays, AI agents and human fallback, measured against a holdout. Synthetic data, fictional company."
requires-python = ">=3.12,<3.13"
# Each phase adds only the libraries it needs.
dependencies = [
    "numpy",
    "pandas",
    "faker",
    "pyyaml",
    "duckdb>=2.0.0",
    "dbt-duckdb>=1.11.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Template sentences are easier to read on one line each.
"synth/text.py" = ["E501"]
