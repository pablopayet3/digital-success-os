[project]
name = "digital-success-os"
version = "0.1.0"
description = "Mini Digital Success OS: customer signals to plays, AI agents and human fallback, measured against a holdout. Synthetic data, fictional company."
requires-python = ">=3.12,<3.13"
# Each phase adds only the libraries it needs.
dependencies = [
    "numpy",
    "pandas",
    "faker",
    "pyyaml",
    "duckdb>=2.0.0",
    "dbt-duckdb>=1.11.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "python-dotenv>=1.2.4",
    "dbt-databricks>=1.11.0",
    "sqlalchemy>=2.1.8",
    "anthropic>=2.8.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.67.0",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "simple-salesforce>=1.12.10",
    "langsmith>=0.14.17",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Template sentences are easier to read on one line each.
"synth/text.py" = ["E501"]
"agents/simulated_customer.py" = ["E501"]
# Report writers: a table row or a sentence of the report is clearer on one line.
"evals/run.py" = ["E501"]
"experiments/analyze.py" = ["E501"]
"experiments/review.py" = ["E501"]
# App pages: a sentence shown on screen is clearer on one line.
"app/views/*.py" = ["E501"]
# Tests read better with each case on one line.
"tests/*.py" = ["E501"]
